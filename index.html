<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de Vida</title>
  <meta name="description" content="Panel de vida personal: finanzas, trabajo y estudios, hábitos y deporte, y agenda.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e0f11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <div class="app">
    <!-- Menú lateral: solo visible en pantallas anchas (ordenador) -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a class="tab" data-area="fin" href="#finanzas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/><path d="M7 3.5h10"/></svg>
        <span>Finanzas</span>
      </a>
      <a class="tab" data-area="work" href="#trabajo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/><path d="M7.5 9l2.5 2-2.5 2M12.5 13h4"/></svg>
        <span>Trabajo</span>
      </a>
      <button class="plus" id="plus" type="button" aria-label="Apuntar algo rápido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a class="tab" data-area="hab" href="#habitos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
        <span>Hábitos</span>
      </a>
      <a class="tab" data-area="ag" href="#agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8.5 3v4M15.5 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>
        <span>Agenda</span>
      </a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <noscript>Esta app necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
